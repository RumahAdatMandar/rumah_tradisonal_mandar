<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Drone Rumah Adat Mandar</title>

    <style>
      /* --- RESET & BASIC STYLE --- */
      body {
        background-color: #0d1117;
        color: #e5e5e5;
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        position: relative;
      }

      /* --- TOMBOL KEMBALI --- */
      .back-button {
        position: absolute;
        top: 20px;
        left: 25px;
        background-color: transparent;
        color: #00c8ff;
        border: 2px solid #00c8ff;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
      }

      .back-button:hover {
        background-color: #00c8ff;
        color: #0d1117;
      }

      /* --- JUDUL & DESKRIPSI --- */
      h1 {
        font-size: 1.8rem;
        color: #00c8ff;
        margin-bottom: 10px;
        margin-top: 60px; /* Jarak agar tidak menabrak tombol back di HP */
        text-align: center;
        letter-spacing: 1px;
      }

      .description {
        max-width: 700px;
        font-size: 0.95rem;
        line-height: 1.6;
        color: #c9d1d9;
        margin-bottom: 25px;
        text-align: center;
        padding: 0 20px;
      }

      /* --- KONTAINER TOMBOL GANTI VIDEO --- */
      .button-container {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
        background-color: #161b22;
        padding: 5px;
        border-radius: 10px;
        border: 1px solid #30363d;
      }

      .video-btn {
        padding: 10px 24px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.3s ease;
        background-color: transparent;
        color: #8b949e;
      }

      .video-btn:hover {
        color: #e5e5e5;
      }

      /* Style untuk tombol yang sedang Aktif */
      .video-btn.active {
        background-color: #00c8ff;
        color: #0d1117;
        box-shadow: 0 4px 12px rgba(0, 200, 255, 0.4);
      }

      /* --- KONTAINER VIDEO --- */
      .model-container {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        padding: 10px;
        margin-bottom: 40px;
        width: 90%;
        max-width: 700px;
        height: auto;
        aspect-ratio: 16/9; /* Menjaga rasio video tetap proporsional */
      }

      video {
        width: 100%;
        height: 100%;
        border-radius: 8px;
        background-color: #000;
        outline: none;
      }

      footer {
        font-size: 0.85rem;
        color: #888;
        text-align: center;
        padding-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <button class="back-button" onclick="window.location.href='index.html'">
      ← Kembali
    </button>

    <h1>Video Drone Rumah Adat Mandar</h1>

    <p class="description">
      Saksikan keindahan arsitektur Rumah Adat Mandar dari udara. Silakan pilih
      durasi video yang ingin Anda tonton di bawah ini.
    </p>

    <div class="button-container">
      <button
        class="video-btn active"
        id="btn-pendek"
        onclick="gantiVideo('pendek')"
      >
        🎥 Video Pendek
      </button>
      <button class="video-btn" id="btn-full" onclick="gantiVideo('full')">
        🎬 Video Full
      </button>
    </div>

    <div class="model-container">
      <video id="mainVideo" controls>
        <source src="assets/drone/Drone Pendek.MP4" type="video/mp4" />
        Browser Anda tidak mendukung tag video.
      </video>
    </div>

    <footer>© 2025 Etnomatematika Rumah Adat Mandar · Tim Pengembang</footer>

    <script>
      function gantiVideo(tipe) {
        // Ambil elemen video dan tombol
        const videoPlayer = document.getElementById("mainVideo");
        const btnPendek = document.getElementById("btn-pendek");
        const btnFull = document.getElementById("btn-full");

        // Logika Ganti Source dan Style Tombol
        if (tipe === "pendek") {
          // Ganti sumber video
          videoPlayer.src = "assets/drone/Drone Pendek.MP4";
          btnPendek.classList.add("active");
          btnFull.classList.remove("active");
        } else {
          // Ganti sumber video
          videoPlayer.src = "assets/drone/Drone full.MP4";

          // Ubah tampilan tombol (Full jadi aktif, Pendek jadi mati)
          btnFull.classList.add("active");
          btnPendek.classList.remove("active");
        }

        // Putar video otomatis setelah diganti
        videoPlayer.play();
      }
    </script>
  </body>
</html>
